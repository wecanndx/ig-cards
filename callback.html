<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>인스타그램 연결 코드</title>
<style>
:root{--bg:#f4f6f8;--fg:#14213d;--card:#fff;--line:#cbd5e0}
@media (prefers-color-scheme:dark){:root{--bg:#14213d;--fg:#fff;--card:#1d2d50;--line:#3a4b70}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Malgun Gothic',sans-serif;display:flex;justify-content:center;padding:40px 16px}
main{max-width:640px;width:100%}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;word-break:break-all;font-family:Consolas,monospace}
button{margin-top:12px;padding:10px 18px;border:0;border-radius:8px;background:#b45309;color:#fff;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>인스타그램 연결 코드</h1>
<p id="msg">확인 중…</p>
<div class="box" id="code" hidden></div>
<button id="copy" hidden>코드 복사</button>
<p>이 코드는 터미널의 <b>node auth.mjs code "코드"</b> 명령에 붙여넣으세요. 다른 사람에게 보내지 마세요.</p>
</main>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var msg = document.getElementById('msg');
  var code = p.get('code');
  if (code) {
    code = code.replace(/#_$/, '');
    msg.textContent = '연결이 완료됐어요. 아래 코드를 복사하세요.';
    var box = document.getElementById('code');
    box.textContent = code; box.hidden = false;
    var b = document.getElementById('copy'); b.hidden = false;
    b.onclick = function(){ navigator.clipboard.writeText(code).then(function(){ b.textContent = '복사됨'; }); };
  } else if (p.get('error')) {
    msg.textContent = '연결이 취소되었거나 오류가 있어요: ' + (p.get('error_description') || p.get('error'));
  } else {
    msg.textContent = '코드가 없어요. 인스타그램 로그인 주소로 먼저 접속하세요.';
  }
})();
</script>
</body>
</html>
